  <!-- terminal shell -->
  <g fill="#fdf8f5" stroke="#8f2a33" stroke-width="2.4" stroke-linejoin="round">
    <rect x="80" y="185" width="390" height="95" rx="6"/>
    <rect x="470" y="70" width="450" height="230" rx="6"/>
    <rect x="780" y="300" width="90" height="300" rx="6"/>
  </g>

  <!-- west transfer corridor -->
