  <!-- main hall rooms -->
  <g fill="#f1dfda" stroke="#c3a9a3" stroke-width="1.1">
    <rect x="486" y="86" width="154" height="96" rx="4"/>
    <rect x="656" y="86" width="88" height="96" rx="4"/>
    <rect x="760" y="86" width="144" height="96" rx="4"/>
    <rect x="486" y="200" width="154" height="84" rx="4"/>
    <rect x="656" y="200" width="104" height="84" rx="4"/>
  </g>
  <g fill="#ddc9c4" stroke="#b99c97" stroke-width="0.9">
    <rect x="500" y="150" width="120" height="10" rx="2"/>
    <rect x="500" y="164" width="120" height="10" rx="2"/>
  </g>
  <g stroke="#b99c97" stroke-width="1.2" fill="none">
    <path d="M676 100v66M692 100v66M708 100v66"/>
  </g>
  <g fill="#ddc9c4" stroke="#b99c97" stroke-width="0.9">
    <rect x="790" y="108" width="10" height="54" rx="2"/>
    <rect x="808" y="108" width="10" height="54" rx="2"/>
    <rect x="826" y="108" width="10" height="54" rx="2"/>
    <rect x="844" y="108" width="10" height="54" rx="2"/>
    <rect x="862" y="108" width="10" height="54" rx="2"/>
  </g>
  <text x="498" y="106" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#7c2a33">CHECK-IN</text>
  <text x="664" y="106" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#7c2a33">SECURITY</text>
  <text x="770" y="106" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#7c2a33">IMMIGRATION</text>
  <text x="498" y="220" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#7c2a33">DUTY FREE</text>
  <text x="664" y="220" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#7c2a33">LOUNGES</text>

  <!-- piers stairs -->
  <g fill="#e7d3ce" stroke="#a97f79" stroke-width="1.1">
    <rect x="848" y="318" width="26" height="32" rx="3"/>
    <rect x="848" y="520" width="26" height="32" rx="3"/>
  </g>
  <g stroke="#a97f79" stroke-width="1" fill="none">
    <path d="M853 324h16M853 330h16M853 336h16M853 342h16"/>
    <path d="M853 526h16M853 532h16M853 538h16M853 544h16"/>
  </g>

  <!-- gates: G9-G12 north pier -->
  <g fill="#c22a34" stroke="#7d1f27" stroke-width="1.5">
