  <!-- assembly point -->
  <g>
    <rect x="300" y="420" width="140" height="80" rx="8" fill="#e9f3ec" stroke="#2f8f5b" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="370" cy="452" r="8" fill="#2f8f5b"/>
    <text x="370" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.2" fill="#246c46">ASSEMBLY AREA C</text>
  </g>
  <path d="M452 344l-62 76" fill="none" stroke="#2f8f5b" stroke-width="2.4" stroke-dasharray="7 6"/>

  <!-- compass -->
  <g transform="translate(934 46)">
    <circle r="20" fill="none" stroke="#b79490" stroke-width="1.2"/>
    <path d="M0 -13 5 6 0 2 -5 6Z" fill="#8f2a33"/>
    <text y="-26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1" fill="#7c2a33">N</text>
