  <!-- exits -->
  <g fill="#2f8f5b">
    <rect x="74" y="234" width="8" height="30" rx="2"/>
    <rect x="440" y="322" width="30" height="8" rx="2"/>
    <rect x="858" y="574" width="28" height="8" rx="2"/>
